modules:
  action:
    # This key and the provider key predate the rename to Keybroker; kept so existing rules keep working.
    - key: sealed-call-automation
      name: Keybroker call
      function: runForAutomation
      actionVerb: GET
      description: Call an operation an admin approved in Keybroker. The rule never receives the credential.
      config:
        resource: automation-config
        render: native
      inputs:
        operation:
          title: Operation
          type: string
          description: Name of an operation defined in Keybroker.
          required: true
        params:
          title: Parameters
          type: string
          description: JSON object of parameter values. Smart values are allowed.
          required: false
      outputs:
        result:
          description: The operation's declared fields, as JSON text.
          type: string
          nullable: false
      outputContext:
        entityName: call
        outputType: OBJECT
        outputDomain: keybroker
    - key: keybroker-call
      name: Keybroker call
      function: callForAgent
      actionVerb: GET
      description: Call a Keybroker operation that only reads (method GET), by name. The credential is never returned; you get only the declared fields or a refusal with its reason. Use keybroker-list first.
      inputs:
        operation:
          title: Operation
          type: string
          description: Name of an operation from keybroker-list.
          required: true
        params:
          title: Parameters
          type: string
          description: 'JSON object of parameter values, for example {"repo": "node"}. Omit if the operation takes none.'
          required: false
    - key: keybroker-send
      name: Keybroker send
      function: sendForAgent
      actionVerb: TRIGGER
      description: Run a Keybroker operation that changes data (any method but GET), by name, such as posting a message. The credential is never returned; you get the status or a refusal with its reason. Use keybroker-list first.
      inputs:
        operation:
          title: Operation
          type: string
          description: Name of an operation from keybroker-list.
          required: true
        params:
          title: Parameters
          type: string
          description: 'JSON object of parameter values, for example {"repo": "node"}. Omit if the operation takes none.'
          required: false
    - key: keybroker-list
      name: Keybroker operations
      function: listForAgent
      actionVerb: GET
      description: List the Keybroker operations you are allowed to call, with each one's destination, parameters (name, where it goes, allowed pattern, required) and returned fields.
      inputs:
        filter:
          title: Filter
          type: string
          description: Optional and currently ignored.
          required: false
  rovo:agent:
    - key: keybroker-agent
      name: Keybroker
      description: Calls the outside APIs your admin approved in Keybroker, by name, without ever seeing a credential.
      prompt: |
        You help people use the integrations a Jira administrator approved in Keybroker.
        Keybroker holds the credentials. You never see, request or handle one, and neither does the user.

        How to work:
        1. Call keybroker-list first to see the operations this user may call: each has a name, a destination, parameters (where each goes and the pattern its value must match) and the fields it returns.
        2. Pick the operation that answers the request. If none fits, say so and name the operations that exist. Never invent an operation, a destination or a field.
        3. Call the operation by name with its parameters as a JSON object in text, for example {"owner": "nodejs", "repo": "node"}: keybroker-call for operations with method GET, keybroker-send for any other method. Before keybroker-send, tell the user exactly what will be sent and where, and only send what they asked for. Use values from the user's request or the current Jira work item; ask if a required value is missing.
        4. Answer from the returned fields only, and say which operation you used.
        If the answer is pending, nothing was sent: give the request ID and say that a Jira admin other than the user must approve it in Jira settings > Apps > Keybroker. When asked later, check its state in keybroker-list (myRequests) and report it; never retry a pending or rejected request to get around approval.

        If the result is a refusal, show the reason as Keybroker gave it and explain what would fix it: an unknown operation means an admin must define it; "not allowed" means an admin must add this person; a pattern mismatch means the value has the wrong form; a missing credential or an unapproved destination is for an admin.
        Never ask anyone to paste a token, password or key. If someone offers one, tell them not to share it here and that an admin stores credentials in Jira settings → Apps → Keybroker.
        Do not retry a refused call with altered values to get around a pattern or an allow-list.
      conversationStarters:
        - What can I look up through Keybroker?
        - Show stars and open issues for nodejs/node
        - Echo this work item's key through the test endpoint
      actions:
        - keybroker-list
        - keybroker-call
        - keybroker-send
  automation:actionProvider:
    - key: sealed-provider
      actions:
        - sealed-call-automation
  jira:adminPage:
    - key: keybroker-admin
      title: Keybroker
      resource: admin
      render: native
      resolver:
        function: adminResolver
  rovo:mcp:
    - key: keybroker-mcp
      name: Keybroker
      tools:
        - keybroker-list
        - keybroker-call
        - keybroker-send
  function:
    - key: runForAutomation
      handler: index.runForAutomation
    - key: callForAgent
      handler: index.callForAgent
    - key: sendForAgent
      handler: index.sendForAgent
    - key: listForAgent
      handler: index.listForAgent
    - key: adminResolver
      handler: index.adminResolver
resources:
  - key: admin
    path: src/frontend/admin.jsx
  - key: automation-config
    path: src/frontend/automation-config.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/17f9e5de-d86b-4ff9-839c-ce5be26a43fb
permissions:
  scopes:
    - storage:app
    - read:jira-work
  external:
    # Destinations are approved by a site admin at runtime, one connection at a time.
    configurable:
      enabled: true
